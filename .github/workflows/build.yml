name: Build Unsigned IPA

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest     # GitHub 免费 macOS 云主机（自带 Xcode）
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 用 -target 而非 -scheme：工程里没有 shared scheme，-scheme 会报 "scheme not found"
      - name: Build (no signing)
        run: |
          xcodebuild clean build \
            -project DouyinSaverIOS.xcodeproj \
            -target DouyinSaverIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            SYMROOT="$(pwd)/build/sym" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_STRICT_CONCURRENCY=minimal

      - name: Package unsigned IPA
        run: |
          APP=$(find build/sym -name "DouyinSaverIOS.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "::error::找不到编译产物 DouyinSaverIOS.app"; exit 1; fi
          echo "app: $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry DouyinSaverIOS_unsigned.ipa Payload
          ls -lh DouyinSaverIOS_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouyinSaverIOS_unsigned
          path: build/DouyinSaverIOS_unsigned.ipa
          retention-days: 30
